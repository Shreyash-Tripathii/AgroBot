# config/ublox_gps.yaml
# u-blox NEO-M8N UART configuration for ROS 2 Jazzy
ublox_gps_node:
  ros__parameters:
    debug: 1
    device: /dev/ttyAMA1           # RPi UART2 (GPIO 0/1) or UART3 (GPIO 4/5)
    frame_id: gps_link             # Ensure base_footprint -> gps_link is in your URDF / static TF
    uart1:
      baudrate: 9600               # Match NEO-M8N factory default (or 38400/115200 if saved in flash)
      in: 1                        # 1 = UBX protocol in
      out: 1                       # 1 = UBX protocol out
    rate: 5.0                      # 5 Hz measurement rate
    nav_rate: 1                    # 1 nav solution per measurement
    dynamic_model: portable        # Options: portable, stationary, pedestrian, automotive
    fix_mode: 2d                   # Ground robot (2d or auto)
    enable_ppp: false
    gnss:
      gps: true
      glonass: true
      beidou: false                # Keep false on M8N if GLONASS is true to allow 5Hz+
      sbas: true                   # Enables GAGAN/WAAS corrections
    inf:
      all: true
    publish:
      all: false
      nav:
        pvt: true
        sat: false
        status: true

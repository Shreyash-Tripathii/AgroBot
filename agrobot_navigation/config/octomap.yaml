octomap_server_node:
  ros__parameters:
    resolution: 0.05               # 5 cm 3D voxel resolution
    frame_id: "map"                # Target world frame (can be map or odom)
    base_frame_id: "base_footprint" # Agro Bot robot base footprint frame
    
    # Range limits (matches RPLiDAR and depth fusion range)
    sensor_model:
      max_range: 10.0
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97

    # Height filtering relative to base_footprint (meters)
    # Clip ground scrub under base_footprint and ceilings above 2.5m
    pointcloud_min_z: 0.02
    pointcloud_max_z: 2.5

    # Ground filter settings
    filter_ground: false
    ground_filter:
      distance: 0.04
      angle: 0.15
      plane_distance: 0.07

    # Latch topic outputs
    latch: false

# config/dual_ekf_navsat.yaml
# 1. Global EKF (map -> odom)
# 2. NavSat Transform (Lat/Lon + Mag IMU -> /odometry/gps)
# 3. Outdoor Global Costmap Override (50x50m rolling window without static_layer)

ekf_filter_node_map:
  ros__parameters:
    use_sim_time: false
    frequency: 15.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Wheel Odometry from ros2_control
    odom0: /agrobot_base_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # Cartesian GPS Odometry from navsat_transform_node
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 10

    # Smooth Yaw Rate & Orientation from BNO085 Game Rotation Vector
    imu0: /imu/data_game
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

navsat_transform_node:
  ros__parameters:
    use_sim_time: false
    frequency: 10.0
    delay: 3.0
    magnetic_declination_radians: 0.021   # ~ +1.2 deg (Northern India)
    yaw_offset: 0.0                       # Calibrate using Section 4 below!
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false

# Overrides indoor static_layer in nav2_params.yaml when mode:=gps
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.10
      robot_radius: 0.11
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: true

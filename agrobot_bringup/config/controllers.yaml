controller_manager:
  ros__parameters:
    update_rate: 50  # Hz, matches the ESP32 50 Hz PID loop / Type 0x01 packet rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    agrobot_base_controller:
      type: diff_drive_controller/DiffDriveController

    kp_controller:
      type: forward_command_controller/ForwardCommandController

    ki_controller:
      type: forward_command_controller/ForwardCommandController

    kd_controller:
      type: forward_command_controller/ForwardCommandController

    # 3-DOF camera arm (only spawned when use_arm:=true). Both claim the arm joints'
    # "position" command interface, so run ONE at a time:
    #   arm_controller          - trajectories / MoveIt (active by default)
    #   arm_position_controller - raw joint angles on /arm_position_controller/commands
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_position_controller:
      type: forward_command_controller/ForwardCommandController

agrobot_base_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.22
    wheel_radius: 0.0325
    # Skid-steer scrubs, so the effective track is wider than the geometric one.
    # Tune empirically (rotate in place, compare odom yaw to real yaw). If you change
    # this, set the same value on the gain scheduler node.
    wheel_separation_multiplier: 1.0
    wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    publish_rate: 50.0
    enable_odom_tf: false  # set false if an EKF owns odom -> base_link
    open_loop: false
    position_feedback: true
    velocity_rolling_window_size: 10

    cmd_vel_timeout: 0.5
    # Jazzy diff_drive_controller takes geometry_msgs/TwistStamped only

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]

# The Float64MultiArray on /<name>/commands maps to `joints` BY INDEX, in this order.
kp_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: kp

ki_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: ki

kd_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: kd

# ---------------------------------------------------------------------------
# Camera arm. Joint order = [base yaw, shoulder pitch, wrist pitch]. The servos are
# open loop, so the reported state is the hardware interface's slew-limited estimate.
# ---------------------------------------------------------------------------
# Trajectory interface for MoveIt2 (FollowJointTrajectory action:
# /arm_controller/follow_joint_trajectory) and plain JointTrajectory messages on
# /arm_controller/joint_trajectory.
arm_controller:
  ros__parameters:
    joints:
      - arm_base_yaw_joint
      - arm_shoulder_pitch_joint
      - arm_wrist_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 1.0
      arm_base_yaw_joint: {trajectory: 0.0, goal: 0.05}
      arm_shoulder_pitch_joint: {trajectory: 0.0, goal: 0.05}
      arm_wrist_pitch_joint: {trajectory: 0.0, goal: 0.05}

# Direct joint angles (rad) as Float64MultiArray, mapped to `joints` BY INDEX. Spawned
# inactive; switch with:
#   ros2 control switch_controllers --deactivate arm_controller --activate arm_position_controller
arm_position_controller:
  ros__parameters:
    joints:
      - arm_base_yaw_joint
      - arm_shoulder_pitch_joint
      - arm_wrist_pitch_joint
    interface_name: position
